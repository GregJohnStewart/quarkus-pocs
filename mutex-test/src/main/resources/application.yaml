
quarkus:
  container-image:
    group: demo
  log:
    console:
      format: "%d{HH:mm:ss:SSS} [%-5p][%-16X{traceId}|%-2X{parentId}|%-16X{spanId}|%-5X{sampled}][%-40c{2.}|%-26t] %s%e%n"
    level: DEBUG
  datasource:
    metrics:
      enabled: true
    telemetry:
      enabled: true
    jdbc:
      telemetry: true
  hibernate-orm:
    metrics: true
  jackson:
    write-dates-as-timestamps: true

# To connect to shared Artemis broker, not devservice
#amqp-host: 192.168.122.76
#amqp-port: 5672
#amqp-username: admin
#amqp-password: admin

mp:
  messaging:
    incoming:
      requests:
        address: quote-requests
        connector: smallrye-amqp
      priority-queue-in:
        enabled: true
        address: app-priority-queue
        connector: smallrye-amqp
        initial-credits: 1

    outgoing:
      priority-queue-out:
        address: app-priority-queue
        connector: smallrye-amqp
smallrye:
  messaging:
    worker:
      single-thread-pool:
        max-concurrency: 1